name: rag

services:
  backend:
    image: rag/backend:latest
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "8080:8080"       # 可选：仅本地调试时直接访问后端
    env_file: .env         # DEEPSEEK_API_KEY 等敏感配置从 .env 注入，不写进镜像
    volumes:
      - ./db:/app/db               # SQLite + ChromaDB 持久化
      - ./uploads:/app/uploads     # 用户上传文件
      - ./llm_model:/app/llm_model # BGE 嵌入模型缓存（首次运行自动下载后复用）
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8080/api/files')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

  frontend:
    image: rag/frontend:latest
    build:
      context: ./frontend
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      backend:
        condition: service_healthy  # 等后端健康后再启动前端
