name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main, master]

jobs:
  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest

    env:
      LLM_API_KEY: "sk-placeholder-for-ci"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Cache pip packages
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements2.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dependencies
        run: |
          echo "[INFO] Installing dependencies from requirements2.txt"
          pip install -r requirements2.txt
          echo "[INFO] Dependency installation completed"

      - name: Verify third-party imports
        run: |
          echo "[INFO] Verifying third-party package imports"
          python -c "
          import langchain, langgraph, chromadb, flask, sqlalchemy
          import fastembed, openai, pydantic
          "
          echo "[INFO] Third-party imports verified"

      - name: Verify project module imports
        run: |
          echo "[INFO] Verifying project module imports"
          python -c "
          import Backend.Domain.Entities.conversation
          import Backend.Application.ContextManagement.ContextManager
          import Backend.Application.UseCases.ChatUseCase
          import Backend.Infrastructure.document.WorkOrderParser
          import Backend.Web.app_factory
          "
          echo "[INFO] Project module imports verified"

      - name: Run unit tests
        run: |
          echo "[INFO] Running unit tests (pattern: *_unit)"
          pytest tests/ -k "_unit" -v --tb=short
          echo "[INFO] Unit tests completed"

  frontend-tests:
    name: Frontend Tests (Jest)
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: |
          echo "[INFO] Installing npm dependencies (npm ci)"
          npm ci --no-audit --no-fund
          echo "[INFO] Frontend dependency installation completed"

      - name: Run Jest unit tests
        env:
          CI: "true"
        run: |
          echo "[INFO] Running react-scripts test in CI mode"
          npm test -- --watchAll=false --ci --reporters=default
          echo "[INFO] Frontend Jest tests completed"

  smoke-test:
    name: Application Smoke Test
    runs-on: ubuntu-latest
    needs: unit-tests

    env:
      LLM_API_KEY: "sk-placeholder-for-ci"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Restore pip cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements2.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dependencies
        run: |
          echo "[INFO] Installing dependencies from requirements2.txt"
          pip install -r requirements2.txt
          echo "[INFO] Dependency installation completed"

      - name: Verify application startup and route registration
        run: |
          echo "[INFO] Starting Flask application via create_app()"
          python - <<'EOF'
          import os, sys

          os.environ.setdefault("LLM_API_KEY", "sk-placeholder-for-ci")

          from Backend.Web.app_factory import create_app
          app = create_app()

          rules = [str(r) for r in app.url_map.iter_rules()]
          expected_routes = [
              "/api/chat",
              "/api/files",
              "/api/fault-trees",
              "/api/work-orders",
          ]
          missing = [r for r in expected_routes if not any(r in rule for rule in rules)]
          if missing:
              print(f"[ERROR] Missing expected routes: {missing}", file=sys.stderr)
              sys.exit(1)

          print(f"[INFO] Flask application initialized successfully")
          print(f"[INFO] Total registered routes: {len(rules)}")
          for route in sorted(rules):
              print(f"[INFO]   {route}")
          EOF
          echo "[INFO] Application startup verification completed"
